
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="contac.css">

    <title>Contact</title>

</head>

<body>

    <main class="layout">

        <!-- Welcome -->

        <section class="hero">

            <h1>
                Bienvenue sur Contact
            </h1>

            <p>
                Vous trouverez ici les différents moyens
                de contacter le développeur.
            </p>

        </section>


        <!-- Contact cards -->

        <div class="cards">


            <!-- Email -->

            <div class="card">

                <div class="card-content">

                    <h3 class="card-title">

                        Email

                        <img
                            src="gmail.png"
                            alt="Email"
                            class="card-icon"
                        >

                    </h3>

                    <a
                        href="mailto:mohamedtouareg78@gmail.com"
                        class="card-button"
                    >
                        Ouvrir
                    </a>

                </div>

            </div>


            <!-- Instagram -->

            <div class="card">

                <div class="card-content">

                    <h3 class="card-title">

                        Instagram

                        <img
                            src="imagest.jpg"
                            alt="Instagram"
                            class="card-icon"
                        >

                    </h3>

                    <a
                        href="https://www.instagram.com/amine_touareg/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="card-button"
                    >
                        Ouvrir
                    </a>

                </div>

            </div>


            <!-- Telegram -->

            <div class="card">

                <div class="card-content">

                    <h3 class="card-title">

                        Telegram

                        <img
                            src="images.jpg"
                            alt="Telegram"
                            class="card-icon"
                        >

                    </h3>

                    <a
                        href="Screenshot_1.png"
                        class="card-button"
                    >
                        Ouvrir
                    </a>

                </div>

            </div>


        </div>

    </main>

</body>

</html>
