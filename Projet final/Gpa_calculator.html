    <main class="layout">
        <div class="main-content">
           
                <section class="hero">

                <h1 class="titel">
                 STdocs CALCULATOR
                </h1>

                <p>
                   Calculateur STdocs pour les étudiants Ingénieurs de l'USTHB — compatible avec le système national algérien. 
                </p>
            </section>

    <div class="from">

        <form class="spécialité">

            <label for="spécialité">
                Choisissez votre spécialité
            </label>

            <select name="spécialité" id="spécialité">

                <option value="" disabled selected>
                    Votre spécialité
                </option>

                <option value="ST-1ere">
                    Ingénieur première année
                </option>

                <option value="groupe-A">
                    Filières du groupe A
                </option>

                <option value="groupe-B">
                    Filières du groupe B
                </option>

                <option value="groupe-C">
                    Filières du groupe C
                </option>

            </select>


            <label for="filière">
                Choisissez votre filière
            </label>

            <select name="filière" id="filière">

                <option value="" disabled selected>
                    Votre filière 
                </option>

            </select>
            <label for="str">Choisissez le semester
            </label>
                <select name="str" id="str">
                    <option value="" disabled selected> Voter semaster</option>
                </select>
        </form>
        <button type="button" class="ok-btn" id="okBtn">
            OK
        </button>
    </div>
